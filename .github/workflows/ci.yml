name: CI

on:
  release:
    types: [published]

# Needed so `gh release upload` can attach assets to the release.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config zip \
            libfreetype6-dev libpng-dev \
            zlib1g-dev libbz2-dev libbrotli-dev

      - name: Build (static)
        run: |
          make clean
          make STATIC=1

      - name: Verify static binary
        run: |
          file termrenderer
          ldd termrenderer 2>&1 || true

      - name: Smoke test
        run: |
          ./termrenderer -- echo "hello world"
          test -f out.png
          echo "smoke test OK"

      - name: Color/render test
        run: |
          ./termrenderer --output color.png -- \
            printf '\033[31mRed\033[0m \033[1mBold\033[0m\n'
          test -s color.png
          echo "render test OK"

      - name: Pixel-level regression tests (Noto)
        run: |
          python3 tests/run_tests.py --binary ./termrenderer

      - name: Verify PNG has rendered content
        run: |
          python3 - <<'EOF'
          import zlib, struct

          def load_png(path):
              data = open(path, 'rb').read()
              pos, idat, w, h = 8, b'', 0, 0
              while pos < len(data):
                  ln  = struct.unpack('>I', data[pos:pos+4])[0]
                  typ = data[pos+4:pos+8]
                  if typ == b'IHDR':
                      w, h = struct.unpack('>II', data[pos+8:pos+16])
                  elif typ == b'IDAT':
                      idat += data[pos+8:pos+8+ln]
                  pos += 12 + ln
              raw = zlib.decompress(idat)
              bpp, stride = 4, w*4 + 1
              rows, prev = [], bytearray(w*4)
              for y in range(h):
                  ft = raw[y*stride]
                  line = bytearray(raw[y*stride+1:y*stride+1+w*4])
                  out = bytearray(w*4)
                  for i in range(w*4):
                      a = out[i-bpp] if i >= bpp else 0
                      b = prev[i]; c = prev[i-bpp] if i >= bpp else 0
                      if   ft == 0: v = line[i]
                      elif ft == 1: v = (line[i]+a) & 255
                      elif ft == 2: v = (line[i]+b) & 255
                      elif ft == 3: v = (line[i]+((a+b)>>1)) & 255
                      elif ft == 4:
                          p = a+b-c; pa,pb,pc = abs(p-a),abs(p-b),abs(p-c)
                          pr = a if (pa<=pb and pa<=pc) else (b if pb<=pc else c)
                          v = (line[i]+pr) & 255
                      out[i] = v
                  rows.append(out); prev = out
              return w, h, rows

          w, h, rows = load_png('color.png')
          minx,miny,maxx,maxy = w,h,-1,-1
          for y in range(h):
              for x in range(0, w*4, 4):
                  r,g,b = rows[y][x], rows[y][x+1], rows[y][x+2]
                  if r or g or b:
                      cx = x//4
                      minx = min(minx,cx); maxx = max(maxx,cx)
                      miny = min(miny,y); maxy = max(maxy,y)
          print(f"size {w}x{h}, content bbox x[{minx}..{maxx}] y[{miny}..{maxy}]")
          assert maxx > minx and maxy > miny, "image appears blank"
          print("PASS: PNG contains rendered text")
          EOF

      - name: Platform layer unit test
        run: |
          gcc -O0 -g -Iinclude -Isrc -o /tmp/pty_check -x c - src/platform_posix.c -lutil <<'EOF'
          #include <stdio.h>
          #include "platform.h"
          static void feed(void *ctx, const char *buf, int len) {
              fwrite(buf, 1, (size_t)len, (FILE*)ctx);
          }
          int main(void) {
              TrProc p;
              if (tr_proc_spawn(&p, "echo pty-ok", 24, 80) < 0) return 1;
              if (tr_proc_drain(&p, stdout, 5000, feed) < 0) return 2;
              tr_proc_close(&p);
              return 0;
          }
          EOF
          out=$(/tmp/pty_check | tr -d '\r\n')
          test "$out" = "pty-ok" || { echo "platform test failed: '$out'"; exit 1; }
          echo "platform test OK"

      - name: Upload render artifact (debug)
        uses: actions/upload-artifact@v4
        with:
          name: renders
          path: |
            color.png
            out.png

      - name: Package and upload binary to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip termrenderer-linux-x86_64.zip termrenderer
          gh release upload "${{ github.event.release.tag_name }}" \
            termrenderer-linux-x86_64.zip --clobber

  macos-build:
    name: Build (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static binary (freetype/libpng/zlib from source)
        # Fully static user-space isn't possible on macOS (no crt0.o); this
        # builds the three libs as static .a and links them, leaving only the
        # system libc dynamic. Result: no Homebrew/third-party dylib deps.
        run: make static

      - name: Verify static binary
        run: |
          file termrenderer
          otool -L termrenderer

      - name: Smoke test
        run: |
          ./termrenderer -- echo "hello from mac"
          test -f out.png
          echo "smoke test OK"

      - name: Pixel-level regression tests (Noto)
        run: |
          python3 tests/run_tests.py --binary ./termrenderer

      - name: Package and upload binary to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip termrenderer-darwin-arm64.zip termrenderer
          gh release upload "${{ github.event.release.tag_name }}" \
            termrenderer-darwin-arm64.zip --clobber

  windows-build:
    name: Build (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 (MinGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-zlib

      - name: Build Windows binary and bundle runtime DLLs
        shell: msys2 {0}
        run: |
          # NOTE: do NOT pass CFLAGS on the command line -- a command-line
          # variable overrides every `CFLAGS +=` in the Makefile, including the
          # one that appends `pkg-config --cflags freetype2 libpng`. Without
          # those the freetype2/libpng16 include dirs are missing and the build
          # dies at `ft2build.h`. Just select target+compiler and let make
          # compute the flags.
          make OS=windows CC=x86_64-w64-mingw32-gcc EXE=termrenderer.exe
          file termrenderer.exe || true
          # The MinGW exe is dynamically linked to freetype/libpng/zlib, so copy
          # every runtime DLL it (transitively) needs into winbin/ -- otherwise
          # the artifact won't run on a machine without MSYS2. We walk the PE
          # import table recursively with objdump and copy from /mingw64/bin,
          # skipping DLLs that ship with Windows itself.
          dest=winbin; mkdir -p "$dest"; cp termrenderer.exe "$dest/"
          imports() { objdump -p "$1" 2>/dev/null | awk '/DLL Name/{print $3}'; }
          changed=1
          while [ "$changed" -eq 1 ]; do
            changed=0
            for f in "$dest"/*; do
              for d in $(imports "$f"); do
                case "$d" in
                  [Kk][Ee][Rr][Nn][Ee][Ll]32.dll|ntdll.dll|msvcrt.dll|ucrtbase.dll|user32.dll|gdi32.dll|advapi32.dll|shell32.dll|ole32.dll|ws2_32.dll|bcrypt.dll|api-ms-*.dll) continue ;;
                esac
                if [ -f "/mingw64/bin/$d" ] && [ ! -f "$dest/$d" ]; then
                  cp "/mingw64/bin/$d" "$dest/" && changed=1
                fi
              done
            done
          done
          ls -la "$dest"

      - name: Smoke test
        shell: msys2 {0}
        run: |
          # The bare termrenderer.exe in the repo root has no runtime DLLs
          # next to it; the bundled copy in winbin/ has every DLL it needs.
          # Run from winbin/ so the loader finds them (exit 127 otherwise).
          ./winbin/termrenderer.exe -- echo "hello from windows"
          test -f winbin/out.png

      - name: Package and upload binary to release
        shell: msys2 {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd winbin && zip -r ../termrenderer-windows-x86_64.zip .)
          gh release upload "${{ github.event.release.tag_name }}" \
            termrenderer-windows-x86_64.zip --clobber
